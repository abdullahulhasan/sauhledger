name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          
      - name: Find pubspec.yaml
        run: find . -name "pubspec.yaml" -maxdepth 3

      - name: Get dependencies
        run: |
          cd $(find . -name "pubspec.yaml" -maxdepth 3 | head -1 | xargs dirname)
          flutter pub get
        
      - name: Build APK
        run: |
          cd $(find . -name "pubspec.yaml" -maxdepth 3 | head -1 | xargs dirname)
          flutter build apk --debug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
